<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ApplyOS — Variante E (Standalone Preview)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #1c1a17; font-family: "Geist", -apple-system, system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; cursor: pointer; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design_files/content.jsx"></script>
<script type="text/babel" src="design_files/screens-e.jsx"></script>
<script type="text/babel" src="design_files/variant-e.jsx"></script>

<script type="text/babel">
  function App() {
    const [lang, setLang] = React.useState("de");
    return (
      <React.Fragment>
        <div style={{ position: "fixed", top: 12, right: 12, zIndex: 100, display: "flex", gap: 6, background: "rgba(28,26,23,.85)", border: "1px solid rgba(237,228,208,.15)", borderRadius: 99, padding: 4 }}>
          {["de", "en"].map(l => (
            <button key={l} onClick={() => setLang(l)} style={{
              padding: "6px 12px", borderRadius: 99, border: 0,
              background: l === lang ? "#3aab83" : "transparent",
              color: l === lang ? "#1c1a17" : "#d4c9b0",
              fontSize: 11, fontWeight: 600, fontFamily: "inherit", cursor: "pointer",
            }}>{l.toUpperCase()}</button>
          ))}
        </div>
        <VariantE t={CONTENT[lang]} accent="#3aab83" lang={lang} />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
